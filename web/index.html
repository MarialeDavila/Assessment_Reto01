<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registro como Proveedor</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5f6b7a; --border:#dde2e8; --accent:#1f5fbf; --user:#e8f0fc; --ok:#1e7a46; --err:#b42318; --warn-bg:#fff6e0; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --panel:#1c2027; --text:#e6e9ee; --muted:#9aa4b2; --border:#2d333d; --accent:#6ea3ff; --user:#1f2a3d; --ok:#4cc38a; --err:#ff7b72; --warn-bg:#3a2e12; --warn:#f0b54a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--muted); }
  main { max-width:900px; margin:0 auto; padding:16px; padding-bottom:140px; }
  .msg { margin:12px 0; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--border); white-space:pre-wrap; overflow-wrap:anywhere; }
  .usuario { background:var(--user); margin-left:15%; }
  .error { border-color:var(--err); color:var(--err); }
  .confirmar { border:2px solid var(--warn); background:var(--warn-bg); }
  .confirmar .etiqueta { color:var(--warn); font-weight:600; display:block; margin-bottom:6px; }
  details.tool { margin:6px 0; border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:var(--bg); font-size:13px; white-space:normal; }
  details.tool summary { cursor:pointer; }
  .estado-ok { color:var(--ok); font-weight:600; } .estado-err { color:var(--err); font-weight:600; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; margin:6px 0 0; }
  .acciones button, footer button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .acciones { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .acciones .primario, footer .primario { background:var(--accent); border-color:var(--accent); color:#fff; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--border); padding:12px 16px; }
  footer form { max-width:900px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); resize:vertical; min-height:44px; max-height:200px; }
  .pensando { color:var(--muted); font-style:italic; }
  .archivos a { color:var(--accent); margin-right:10px; font-size:13px; }
  .ejemplos button { font-size:13px; margin:4px 4px 0 0; }
</style>
</head>
<body>
<header>
  <div><h1>Agente de Registro como Proveedor</h1><small id="estado">Conectando...</small></div>
  <button id="nueva" type="button">Nueva sesión</button>
</header>
<main id="chat">
  <div class="msg">Indique el caso a procesar. Casos disponibles: co-industrias-delta, ec-corp-andina, hn-agroexport-sula, pa-logistica-istmo.
    <div class="ejemplos acciones"><button type="button" data-ejemplo='Procesa el caso "ec-corp-andina". Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.'>Ejemplo: ec-corp-andina</button><button type="button" data-ejemplo='Procesa el caso "co-industrias-delta".'>co-industrias-delta</button><button type="button" data-ejemplo='Procesa el caso "pa-logistica-istmo".'>pa-logistica-istmo</button></div>
  </div>
</main>
<footer>
  <form id="form">
    <textarea id="entrada" placeholder="Escriba su mensaje..." required maxlength="4000"></textarea>
    <button class="primario" type="submit" id="enviar">Enviar</button>
  </form>
</footer>
<script>
  const $ = (s) => document.querySelector(s)
  const chat = $("#chat")
  const nuevaId = () => "s-" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36)
  let sessionId = nuevaId()
  let claveAcceso = ""
  try { sessionId = sessionStorage.getItem("sessionId") || sessionId; sessionStorage.setItem("sessionId", sessionId); claveAcceso = sessionStorage.getItem("claveAcceso") || "" } catch {}

  function el(tag, cls, texto) { const e = document.createElement(tag); if (cls) e.className = cls; if (texto !== undefined) e.textContent = texto; return e }
  function bajar() { window.scrollTo(0, document.body.scrollHeight) }

  function tarjetaHerramienta(t) {
    const d = el("details", "tool")
    const s = el("summary")
    s.append(el("span", t.ok ? "estado-ok" : "estado-err", t.ok ? "OK " : "ERROR "), document.createTextNode(t.nombre + ": " + t.resumen))
    d.append(s, el("pre", "", "Argumentos: " + JSON.stringify(t.args, null, 2)), el("pre", "", "Resultado: " + formatear(t.resultado)))
    return d
  }
  function formatear(r) { try { return JSON.stringify(JSON.parse(r), null, 2) } catch { return r } }

  function casoDe(toolCalls) { const t = (toolCalls || []).find((x) => x.args && x.args.caso); return t ? t.args.caso : null }

  async function enlacesArchivos(caso, cont) {
    const r = await api("/api/archivos/" + encodeURIComponent(caso))
    if (!r || !r.ok) return
    const div = el("div", "archivos")
    div.append(document.createTextNode("Archivos de out/" + caso + "/: "))
    for (const a of r.archivos) { const l = el("a", "", a); l.href = "/api/archivos/" + caso + "/" + a.split("/").map(encodeURIComponent).join("/"); l.target = "_blank"; div.append(l) }
    cont.append(div)
  }

  function mostrarAgente(r) {
    const m = el("div", "msg" + (r.error ? " error" : "") + (r.needsConfirmation ? " confirmar" : ""))
    if (r.needsConfirmation) m.append(el("span", "etiqueta", "El agente solicita su confirmación"))
    for (const t of r.toolCalls || []) m.append(tarjetaHerramienta(t))
    m.append(el("div", "", r.reply))
    if (r.modelo) m.append(el("div", "pensando", "Respondió: " + r.modelo))
    if (r.needsConfirmation) {
      const acc = el("div", "acciones")
      const si = el("button", "primario", "Confirmar envío"); si.type = "button"; si.onclick = () => enviar("Sí, confirmo el envío.")
      const no = el("button", "", "No enviar todavía"); no.type = "button"; no.onclick = () => enviar("No, todavía no envíes.")
      acc.append(si, no); m.append(acc)
    }
    const caso = casoDe(r.toolCalls)
    if (caso) enlacesArchivos(caso, m)
    chat.append(m); bajar()
  }

  async function api(ruta, opciones) {
    const headers = { "content-type": "application/json" }
    if (claveAcceso) headers["x-access-key"] = claveAcceso
    try { const res = await fetch(ruta, { ...opciones, headers }); return await res.json() } catch { return null }
  }

  async function enviar(texto) {
    if (!texto.trim()) return
    chat.append(el("div", "msg usuario", texto)); bajar()
    const pensando = el("div", "msg pensando", "El agente está pensando y ejecutando herramientas...")
    chat.append(pensando); bajar()
    $("#enviar").disabled = true
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId, message: texto }) })
    pensando.remove(); $("#enviar").disabled = false
    if (!r) return mostrarAgente({ reply: "No fue posible contactar al servidor. Intente de nuevo.", error: true })
    if (r.ok === false) return mostrarAgente({ reply: r.error, error: true })
    mostrarAgente(r)
  }

  $("#form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("#entrada").value; $("#entrada").value = ""; enviar(t) })
  $("#entrada").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit() } })
  document.querySelectorAll("[data-ejemplo]").forEach((b) => b.addEventListener("click", () => { $("#entrada").value = b.dataset.ejemplo; $("#entrada").focus() }))
  $("#nueva").onclick = () => { sessionId = nuevaId(); try { sessionStorage.setItem("sessionId", sessionId) } catch {}; location.reload() }

  ;(async () => {
    const h = await api("/api/health")
    if (!h) return ($("#estado").textContent = "Servidor no disponible")
    $("#estado").textContent = "Proveedor: " + h.provider + " | Modelo: " + h.model
    if (h.accessKeyRequired && !claveAcceso) { claveAcceso = prompt("Clave de acceso:") || ""; try { sessionStorage.setItem("claveAcceso", claveAcceso) } catch {} }
    const s = await api("/api/sessions/" + sessionId)
    if (s && s.historial) for (const e of s.historial) e.rol === "usuario" ? chat.append(el("div", "msg usuario", e.texto)) : mostrarAgente({ reply: e.texto, toolCalls: e.toolCalls, needsConfirmation: e.needsConfirmation, error: e.rol === "error", modelo: e.modelo })
  })()
</script>
</body>
</html>
